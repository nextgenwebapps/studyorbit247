name = "studyorbit247-api"
main = "src/index.js"
compatibility_date = "2026-11-24"

[[d1_databases]]
binding = "DB"
database_name = "studyorbit247"
database_id = "e1ccf575-99c8-4c67-9d6b-f3f7a0243d10"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "studyorbit247"

[vars]
ADMIN_ORIGIN = "https://studyorbit247.web.app"
PUBLIC_ORIGIN = "https://studyorbit247.web.app"

# Add a same-domain route only if the site domain is later moved to Cloudflare:
# routes = [{ pattern = "YOUR_DOMAIN/api/*", zone_name = "YOUR_DOMAIN" }]
